name: Website UX and content quality
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site_health_report.cjs'
      - 'scripts/sync_jobs.py'
      - 'tests/**'
      - '.github/workflows/ux-quality.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site_health_report.cjs'
      - 'scripts/sync_jobs.py'
      - 'tests/**'
      - '.github/workflows/ux-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate employer RSS and allowlisted URLs
        run: python -m unittest discover -s tests -p 'test_feed.py' -v
      - name: Validate JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/ads-loader.js
          node --check scripts/site_health_report.cjs
      - name: Validate employer feed and UI regression
        run: |
          node --test tests/data-integrity.test.cjs tests/ux-regression.test.cjs
          node scripts/site_health_report.cjs
