name: Refresh public employer jobs
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roleglobe-jobs-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync public employer jobs
        run: python scripts/sync_jobs.py
      - name: Commit updated listings
        run: |
          git config user.name 'RoleGlobe Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh employer-source jobs'
            git push
          else
            echo 'No changes'
          fi
