name: Weekly RoleGlobe source quality report
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check employer-source publication freshness
        run: |
          node --check scripts/site_health_report.cjs
          node --test tests/data-integrity.test.cjs
          node scripts/site_health_report.cjs --strict
